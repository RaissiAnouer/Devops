name: linting

on: 
     push:
        branches:
            - main

jobs:
    code_Checkout_linting:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: https://github.com/actions/checkout@v5
          
            - name: super-linter
              uses: super-linter/super-linter@v8.2.1

